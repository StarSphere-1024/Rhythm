<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Rhythm — three time blocks and a completion check</title>
  <desc>Original reference artwork, including its transparent inset and rounded background.</desc>
  <g id="background">
    <rect x="15" y="15" width="70" height="70" rx="19" fill="#208D78"/>
  </g>
  <g id="foreground" fill="#D7F9E8">
    <rect id="short-block" x="29" y="28" width="12" height="16" rx="4"/>
    <rect id="middle-block" x="46" y="28" width="12" height="28" rx="4"/>
    <rect id="right-block" x="63" y="28" width="9" height="21" rx="4"/>
    <path id="completion-check" d="M29 66 L43 75 L70 51" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
  </g>
</svg>
