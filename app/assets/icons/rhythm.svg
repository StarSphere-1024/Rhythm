<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <title>Rhythm — three time blocks and a completion check</title>
  <desc>Adaptive-icon artwork. The 108-unit foreground keeps every mark within the central 66-unit safe area. Background is a separate layer.</desc>
  <g id="background">
    <rect width="108" height="108" fill="#208d78"/>
  </g>
  <g id="foreground" fill="#d7f9e8">
    <rect id="short-block" x="24" y="34" width="14" height="22" rx="7"/>
    <rect id="middle-block" x="47" y="27" width="14" height="29" rx="7"/>
    <rect id="tall-block" x="70" y="21" width="14" height="35" rx="7"/>
    <path id="completion-check" d="M32 69 45 82 76 61" fill="none" stroke="#d7f9e8" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
  </g>
</svg>
